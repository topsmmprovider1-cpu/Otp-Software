<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — OTP Shop</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="navbar">
  <a class="logo" href="/"><span class="dot"></span> OTP<span><b>Shop</b></span></a>
  <div class="nav-links"><a href="/" class="btn ghost">← Back to home</a></div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <div class="sub">Login to your account and buy virtual numbers</div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" id="password" placeholder="••••••••" required>
      </div>
      <button class="btn solid" style="width:100%;justify-content:center" id="btnSubmit">Login</button>
    </form>
    <div class="form-foot">New here? <a href="/register">Create an account</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
function getNext() {
  const n = new URLSearchParams(location.search).get('next');
  return n && /^\/(?!\/)/.test(n) ? n : '';
}
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const data = await API.post('/api/auth/login', {
      email: email.value.trim(), password: password.value,
    });
    API.setSession(data); const user = data.user;
    toast('Login successful!');
    startAutoRefresh();
    setTimeout(() => {
      const next = getNext();
      if (next) { window.location.href = next; return; }
      window.location.href = user.role === 'admin' ? '/admin/index' : '/app/dashboard';
    }, 400);
  } catch (err) {
    toast(err.message, 'err');
    btn.disabled = false; btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
