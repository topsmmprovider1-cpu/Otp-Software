<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · SMSOTP</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-login-bg { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .alogin-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 34px 32px; box-shadow: 0 20px 50px rgba(15,23,42,.10); }
  .alogin-brand { text-align: center; margin-bottom: 26px; }
  .alogin-brand .logo { justify-content: center; font-size: 22px; }
  .alogin-brand .sub { color: var(--muted); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
  .alogin-card h2 { font-size: 19px; text-align: center; margin-bottom: 4px; }
  .alogin-card > p { text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 22px; }
  .err-line { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; font-size: 13px; padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; display: none; }
  .field-row { display: flex; gap: 10px; }
  .field-row .input { flex: 1; }
</style>
</head>
<body class="admin-login-bg">
<div class="alogin-card">
  <div class="alogin-brand">
    <span class="logo"><span class="dot"></span> SMS<b>OTP</b></span>
    <div class="sub">Admin Console</div>
  </div>
  <h2>Sign in to admin panel</h2>
  <p>Restricted area — admin credentials required.</p>
  <div class="err-line" id="errLine"></div>
  <div class="field">
    <label>Email</label>
    <input class="input" id="email" type="email" autocomplete="username" placeholder="admin@site.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="btn solid" id="btn" style="width:100%;justify-content:center;padding:12px">Sign in</button>
  <div class="form-foot"><a href="/">← Back to storefront</a></div>
</div>

<script src="/js/api.js"></script>
<script>
(async function () {
  const next = (new URLSearchParams(location.search).get('next') || '').match(/^\/(?!\/)/) ? new URLSearchParams(location.search).get('next') : '';
  const me = await refreshMe();
  if (me && me.role === 'admin') { window.location.href = next || '/admin/index'; return; }

  const email = document.getElementById('email');
  const pass = document.getElementById('password');
  const btn = document.getElementById('btn');
  const err = document.getElementById('errLine');
  const showErr = (msg) => { err.textContent = msg; err.style.display = 'block'; };

  async function submit() {
    err.style.display = 'none';
    if (!email.value.trim() || !pass.value) return showErr('Email and password required');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const data = await API.post('/api/auth/admin-login', { email: email.value.trim(), password: pass.value });
      API.setSession(data);
      startAutoRefresh();
      window.location.href = next || '/admin/index';
    } catch (e) {
      showErr(e.message || 'Login failed');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  }
  btn.onclick = submit;
  document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
